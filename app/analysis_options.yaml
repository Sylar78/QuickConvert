include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Code de l'authentification Supabase, gardé pour plus tard : la dépendance
    # est commentée dans pubspec.yaml, donc ce fichier ne compile pas et n'est
    # exporté par aucun barrel. L'exclure garde `flutter analyze` lisible.
    - "lib/services/supabase_service.dart"
  errors:
    missing_required_param: error
    missing_return: error

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - use_key_in_widget_constructors
    - avoid_print
    - prefer_final_fields
    - unnecessary_this
