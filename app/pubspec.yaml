name: quick_convert
description: QuickConvert — Convertis tes fichiers instantanément depuis ton smartphone.
publish_to: 'none'
version: 1.0.1+8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # HTTP client
  http: ^1.2.0

  # Supabase backend — désactivé temporairement (incompatible Flutter 3.24 Android build)
  # supabase_flutter: ^2.5.6

  # File handling
  file_picker: ^8.0.6
  path_provider: ^2.1.3
  path: ^1.9.0
  open_file: ^3.3.2

  # PDF operations
  pdf: ^3.10.8
  printing: ^5.13.1
  syncfusion_flutter_pdf: ^26.1.41
  pdfx: ^2.6.0

  # Image operations
  image: ^4.2.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Sharing
  share_plus: ^9.0.0

  # Ads (AdMob)
  google_mobile_ads: ^5.1.0

  # In-app purchase (Premium)
  in_app_purchase: ^3.2.0

  # Demande de note sur les stores
  in_app_review: ^2.0.9

  # Local storage & history
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # UI
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  dotted_border: ^2.1.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
