<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner glow -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Lightning bolt / conversion arrow symbol -->
  <g filter="url(#shadow)">
    <!-- Left document icon -->
    <rect x="100" y="160" width="120" height="160" rx="12" fill="white" opacity="0.95"/>
    <rect x="116" y="185" width="60" height="8" rx="4" fill="#667eea" opacity="0.6"/>
    <rect x="116" y="201" width="88" height="8" rx="4" fill="#667eea" opacity="0.4"/>
    <rect x="116" y="217" width="72" height="8" rx="4" fill="#667eea" opacity="0.4"/>
    <rect x="116" y="240" width="88" height="50" rx="6" fill="#667eea" opacity="0.15"/>
    
    <!-- Central conversion arrows -->
    <path d="M245 230 L290 230 L280 215 L315 240 L280 265 L290 250 L245 250 Z" fill="url(#arrowGrad)" opacity="0.95"/>
    <path d="M315 270 L270 270 L280 285 L245 260 L280 235 L270 250 L315 250 Z" fill="url(#arrowGrad)" opacity="0.6"/>
    
    <!-- Right document icon (converted) -->
    <rect x="292" y="160" width="120" height="160" rx="12" fill="white" opacity="0.95"/>
    <rect x="308" y="185" width="60" height="8" rx="4" fill="#764ba2" opacity="0.6"/>
    <rect x="308" y="201" width="88" height="8" rx="4" fill="#764ba2" opacity="0.4"/>
    <rect x="308" y="217" width="72" height="8" rx="4" fill="#764ba2" opacity="0.4"/>
    <!-- Checkmark on converted file -->
    <circle cx="352" cy="268" r="22" fill="#4ade80" opacity="0.9"/>
    <path d="M340 268 L349 277 L365 259" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- "QC" text at bottom -->
  <text x="256" y="400" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle" opacity="0.95">QuickConvert</text>
</svg>
